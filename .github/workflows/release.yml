# 独立的 GitHub Release 工作流：tag 推送或手动 dispatch 后创建 Release。
# 与 publish.yml（npm OIDC 发布）互不影响，二者由同一批 tag 触发，各自幂等。
# 认证只用内置 github.token（仅本 job 内提升 contents: write），无需 NPM_TOKEN 或任何密钥。

name: Release

on:
  push:
    tags:
      - dsh-v*
      - opencode-v*
      - codex-v*
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已存在 tag，例如 dsh-v0.13.1'
        type: string
        required: true
      make_latest:
        description: '是否标记为该仓库的最新发布（预发布版本会强制为 false）'
        type: boolean
        default: false

# 默认最小权限，只在 release job 内覆盖为 contents: write
permissions:
  contents: read

# 同一 tag 串行执行且不取消进行中的任务，避免并发创建重复 Release
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库（--generate-notes 需要完整历史与 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 解析 tag 与包元数据
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          MAKE_LATEST: ${{ inputs.make_latest }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # 所有外部输入只经 env 进入 shell，不拼进脚本、不 eval
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            if [ "$EVENT_NAME" != "push" ]; then
              echo "::error::手动触发必须提供 tag 输入"
              exit 1
            fi
            TAG="$REF_NAME"
          fi

          # 每包附带：发布平台名（尾块文案用）、安装命令模板（@@VER@@ 稍后替换为真实版本）、是否发布到 npm。
          # 安装命令均取自对应 packages/<pkg>/README.md，改 README 时请同步这里。
          case "$TAG" in
            dsh-v*)
              PKG="dsh-cohub"
              MANIFEST="packages/dsh-cohub/package.json"
              PLATFORM="DSH"
              INSTALL_TPL="dsh plugin --profile web add dsh-cohub@@VER@@"
              IS_PRIVATE=false
              ;;
            opencode-v*)
              PKG="oh-my-opencode-cohub"
              MANIFEST="packages/oh-my-opencode-cohub/package.json"
              PLATFORM="opencode"
              INSTALL_TPL="opencode plugin oh-my-opencode-cohub@@VER@@ --global --force"
              IS_PRIVATE=false
              ;;
            codex-v*)
              PKG="oh-my-codex-cohub"
              MANIFEST="packages/oh-my-codex-cohub/package.json"
              PLATFORM="Codex"
              # 私有包不发 npm：走仓库内 marketplace 安装，版本由 marketplace 条目决定
              INSTALL_TPL="codex plugin marketplace add . && codex plugin add oh-my-codex-cohub@cohub"
              IS_PRIVATE=true
              ;;
            *)
              echo "::error::无法识别的 tag 前缀: $TAG（期望 dsh-v* / opencode-v* / codex-v*）"
              exit 1
              ;;
          esac

          VERSION="${TAG#*-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $TAG 的版本段 '$VERSION' 不是合法 SemVer"
            exit 1
          fi

          # dispatch 场景本地可能没有该 tag，先同步远端 tag 引用（失败不阻断，最终由 rev-parse 守门）
          # fetch 只是二次保险：把 stderr 带进 warning 便于诊断网络/权限问题，失败不中止脚本
          FETCH_ERR=$(git fetch --tags --force origin 2>&1 >/dev/null) || echo "::warning::fetch tags failed, fallback to checkout tags: $FETCH_ERR"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 在仓库中不存在"
            exit 1
          fi

          # 版本一律读 tag 快照内的清单，不读工作区文件：dispatch 补建历史 tag 时工作区是
          # 默认分支 HEAD，用工作区文件会让除最新版外所有 tag 的等值校验必然失败。
          if ! git cat-file -e "$TAG:$MANIFEST" 2>/dev/null; then
            echo "::error::tag $TAG 内不存在该 manifest 路径: $MANIFEST"
            exit 1
          fi
          MANIFEST_VERSION=$(git show "$TAG:$MANIFEST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).version)))') || {
            echo "::error::无法解析 $MANIFEST@$TAG 的 version 字段（该 tag 快照内清单损坏或缺少 version）"
            exit 1
          }
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::版本不一致: tag=$TAG（$VERSION）≠ $MANIFEST@$TAG 快照版本=$MANIFEST_VERSION"
            exit 1
          fi

          PRERELEASE=false
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
          esac

          # 安装命令只在这里定型，避免模板占位符泄漏到 Release 正文
          INSTALL_CMD="${INSTALL_TPL/@@VER@@/$VERSION}"

          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$PRERELEASE" = "true" ]; then LATEST=false; else LATEST=true; fi
          else
            case "${MAKE_LATEST:-false}" in
              true|True|TRUE) LATEST=true ;;
              *) LATEST=false ;;
            esac
            # 预发布永不标记为 latest
            if [ "$PRERELEASE" = "true" ]; then LATEST=false; fi
          fi

          {
            echo "tag=$TAG"
            echo "package=$PKG"
            echo "version=$VERSION"
            echo "manifest=$MANIFEST"
            echo "prerelease=$PRERELEASE"
            echo "latest=$LATEST"
            echo "platform=$PLATFORM"
            echo "install_cmd=$INSTALL_CMD"
            echo "is_private=$IS_PRIVATE"
          } >> "$GITHUB_OUTPUT"

          echo "解析结果: tag=$TAG package=$PKG version=$VERSION manifest=$MANIFEST prerelease=$PRERELEASE latest=$LATEST private=$IS_PRIVATE"
          echo "安装命令: $INSTALL_CMD"

      - name: 创建 GitHub Release（幂等）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PKG: ${{ steps.meta.outputs.package }}
          VERSION: ${{ steps.meta.outputs.version }}
          MANIFEST: ${{ steps.meta.outputs.manifest }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          LATEST: ${{ steps.meta.outputs.latest }}
          PLATFORM: ${{ steps.meta.outputs.platform }}
          INSTALL_CMD: ${{ steps.meta.outputs.install_cmd }}
          IS_PRIVATE: ${{ steps.meta.outputs.is_private }}
        run: |
          set -euo pipefail
          TITLE="${PKG} ${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过创建（幂等）"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            echo "创建预发布 Release：$TITLE"
          else
            echo "创建 Release：$TITLE（latest=$LATEST）"
          fi

          # 正文来源：优先抽取 tag 快照内 CHANGELOG 的对应版本段，缺失/抽取为空才回退自动生成。
          # 抽段规则：起于 `##[ \t]` 且含带边界版本号的行，止于下一 `## ` 行（不含），去尾空行，截 60000 字符。
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          CHANGELOG="$(dirname "$MANIFEST")/CHANGELOG.md"
          NOTES_SOURCE=generated
          if git cat-file -e "$TAG:$CHANGELOG" 2>/dev/null &&
            git show "$TAG:$CHANGELOG" | awk -v ver="$VERSION" '
              BEGIN {
                v = ver
                gsub(/[.]/, "[.]", v)
                pat = "[^0-9.]" v "[^0-9.]"
                started = 0
                out = ""
              }
              started == 0 {
                if ($0 ~ /^##[ \t]/ && (" " $0 " ") ~ pat) {
                  started = 1
                  out = $0 "\n"
                }
                next
              }
              {
                if ($0 ~ /^## /) exit
                out = out $0 "\n"
              }
              END {
                if (started == 0) exit
                sub(/\n+$/, "", out)
                if (length(out) > 60000) out = substr(out, 1, 60000)
                printf "%s", out
              }
            ' > "$NOTES_FILE" &&
            [ -s "$NOTES_FILE" ]; then
            NOTES_SOURCE=changelog
          fi
          echo "::notice::notes source=$NOTES_SOURCE"

          # 尾块：CHANGELOG 段落之后固定追加「发布说明」，补 CHANGELOG 段本身没有的安装入口与发版范围。
          # 只在 notes 来自 CHANGELOG 时追加；--generate-notes 回退分支的正文由 GitHub 生成，不追加。
          # 自验脚本按下面两行标记整段提取执行，改逻辑时请保留标记。
          # BEGIN release-notes-tail
          if [ "$NOTES_SOURCE" = "changelog" ]; then
            {
              printf '\n\n---\n\n## 发布说明\n\n'
              if [ "$IS_PRIVATE" = "true" ]; then
                printf -- '- 本包为 private，不发布到 npm；安装方式：`%s`\n' "$INSTALL_CMD"
              else
                printf -- '- `%s@%s`：https://www.npmjs.com/package/%s/v/%s\n' "$PKG" "$VERSION" "$PKG" "$VERSION"
              fi
              printf -- '- 安装：`%s`\n' "$INSTALL_CMD"
              printf -- '- 必须重启 %s 后才会加载新版本。\n' "$PLATFORM"
              printf -- '- 仅本包发版，其他包版本不变。\n'
            } >> "$NOTES_FILE"
          fi
          # END release-notes-tail
          echo "::notice::notes tail=$([ "$NOTES_SOURCE" = "changelog" ] && echo appended || echo skipped)"

          # 显式声明：预发布永不设为 Latest
          if [ "$NOTES_SOURCE" = "changelog" ]; then
            args=(--title "$TITLE" --notes-file "$NOTES_FILE" --verify-tag)
          else
            args=(--title "$TITLE" --generate-notes --verify-tag)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          elif [ "$LATEST" = "true" ]; then
            args+=(--latest)
          else
            args+=(--latest=false)
          fi

          if gh release create "$TAG" "${args[@]}"; then
            echo "已创建 Release：$TITLE"
            exit 0
          fi

          # create 失败可能只是并发创建抢先成功，复查一次
          echo "::warning::gh release create 失败，复查是否已被并发创建"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已由并发任务创建，视为成功"
            exit 0
          fi
          echo "::error::创建 Release 失败，且 tag $TAG 不存在对应 Release"
          exit 1
