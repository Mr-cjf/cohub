#roleCatalog{display:grid;gap:22px}.role-group{display:grid;gap:9px}.role-group-head{display:flex;align-items:center;gap:8px;padding-bottom:7px;border-bottom:1px solid var(--line-soft);font-size:13px;font-weight:650}.role-group-head span{color:var(--muted);font-size:12px;font-weight:500}.catalog-item{padding:13px 14px;border:1px solid var(--line-soft);border-radius:var(--radius);background:#20252a}.catalog-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.catalog-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}.catalog-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}.catalog-desc{margin-top:3px;color:var(--muted);font-size:12px}.template-area{padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:#1d2227}.template-heading{display:flex;align-items:center;gap:10px;margin-bottom:12px}.template-heading strong{font-size:14px}.template-count{margin-left:auto;color:var(--muted);font-size:12px}.template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-height:min(64vh,680px);overflow:auto;padding:1px}.template-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;min-height:132px;padding:12px;border:1px solid var(--line);border-radius:6px;background:#22272d;text-align:left;transition:border-color .16s ease,background .16s ease,transform .16s ease}.template-card:hover{border-color:#5b85ad;background:#27313a;transform:translateY(-1px)}.template-card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.template-name{font-weight:650;overflow-wrap:anywhere}.template-summary{display:-webkit-box;overflow:hidden;color:var(--muted);font-size:12px;line-height:1.45;-webkit-line-clamp:2;-webkit-box-orient:vertical}.template-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}.blank-template{border-style:dashed}.catalog-empty{padding:12px 0;color:var(--muted);font-size:12px}@media(max-width:860px){.template-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.catalog-top{flex-direction:column;gap:10px}.catalog-actions{justify-content:flex-start}}@media(max-width:580px){.template-grid{grid-template-columns:1fr;max-height:62vh}.template-heading{flex-wrap:wrap}.template-count{margin-left:0}.catalog-actions{width:100%}.catalog-actions .btn{flex:1}.template-card{min-height:118px}}

<body>
<div class="shell">
  <header class="topbar"><div class="brand"><span class="mark">co</span><span>cohub</span><span class="crumb">设置 / 团队编排</span></div><span>原型 · 本地演示</span></header>
  <main>
    <div class="hero"><div><div class="eyebrow">ORCHESTRATION</div><h1>团队编排</h1><p class="sub">管理角色组合、队长与可用工具。</p></div></div>
    <div class="current-bar"><div class="current-main"><div class="current-line"><span class="current-label">当前会话预设：</span><strong id="currentName">写作组</strong><code class="preset-id" id="currentPresetId">cohub-team-writing</code><span class="switch-hint">切换请在 设置 → Agent 预设 里选择</span></div><div class="current-foot">每个团队在保存时会自动注册为一个 Agent 预设，随 DSH 启动即可选。</div></div><button class="btn primary" data-action="open-presets">打开 Agent 预设</button></div>
    <div class="page-tabs" role="tablist" aria-label="团队与角色视图">
      <button class="page-tab active" id="teamsTab" role="tab" aria-selected="true" aria-controls="teamsSection" data-tab="teams">团队</button>
      <button class="page-tab" id="rolesTab" role="tab" aria-selected="false" aria-controls="librarySection" data-tab="roles">角色</button>
    </div>
    <section class="section" id="teamsSection" role="tabpanel" aria-labelledby="teamsTab"><div class="section-head"><div><div class="section-title"><h2>团队列表</h2></div><p class="section-note">用团队限定会话可调用的角色；保存后作为 Agent 预设使用。</p></div><button class="btn primary" data-action="new-team">＋ 新建团队</button></div><div class="team-grid" id="teamGrid"></div></section>
    <section class="section" id="librarySection" role="tabpanel" aria-labelledby="rolesTab" hidden><div class="section-head"><div><div class="section-title"><h2>角色库</h2></div><p class="section-note">角色是团队成员的来源；建好角色后到上面的团队里勾选，团队会随预设一起生效。</p></div><button class="btn primary" id="addRole">＋ 新建角色</button></div>
      <div class="role-search"><input type="search" data-role-search placeholder="搜索角色名或职责…" aria-label="搜索角色名或职责" value=""></div>
      <div class="catalog-list" id="roleCatalog"></div>
      <p class="footnote">角色、团队与工具绑定仅保存在当前页面内存中。</p>
      <div id="createMount"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<dialog id="detailDialog" aria-labelledby="detailTitle"></dialog>
<script>
// 页面所需的演示数据集中在 MOCK，不发起网络请求。
const MOCK={
  leadRoleIds:['co-orchestrator','co-team-lead'],
  currentSessionPresetId:'cohub-team-writing',
  tools:[
    {id:'tool-read',group:'文件',name:'读取文件',plugin:'tool-read',gate:'跨平台'},
    {id:'tool-edit',group:'文件',name:'编辑文件',plugin:'tool-edit',gate:'跨平台'},
    {id:'tool-write',group:'文件',name:'写入文件',plugin:'tool-write',gate:'跨平台'},
    {id:'tool-glob',group:'文件',name:'路径搜索',plugin:'tool-glob',gate:'跨平台'},
    {id:'tool-grep',group:'文件',name:'内容搜索',plugin:'tool-grep',gate:'跨平台'},
    {id:'tool-web-search',group:'联网',name:'网页搜索',plugin:'tool-web-search',gate:'需要联网'},
    {id:'tool-web-fetch',group:'联网',name:'网页读取',plugin:'tool-web-fetch',gate:'需要联网'},
    {id:'tool-bash',group:'执行',name:'Shell',plugin:'bash',gate:'macOS / Linux'},
    {id:'tool-pwsh',group:'执行',name:'Shell',plugin:'pwsh',gate:'仅 Windows'},
    {id:'tool-skill',group:'编排',name:'技能加载',plugin:'tool-skill',gate:'跨平台'},
    {id:'tool-todo-write',group:'编排',name:'待办管理',plugin:'tool-todo-write',gate:'跨平台'},
    {id:'tool-background-task',group:'编排',name:'后台任务',plugin:'tool-background-task',gate:'跨平台'},
    {id:'tool-target',group:'编排',name:'目标跟踪',plugin:'tool-target',gate:'跨平台'},
    {id:'tool-ask-user-question',group:'编排',name:'追问用户',plugin:'tool-ask-user-question',gate:'跨平台'},
    {id:'tool-delegate',group:'编排',name:'单角色委派',plugin:'tool-delegate',gate:'跨平台'},
    {id:'tool-delegate-batch',group:'编排',name:'批量委派',plugin:'tool-delegate_batch',gate:'跨平台'},
    {id:'tool-workflow',group:'编排',name:'工作流',plugin:'tool-workflow',gate:'跨平台'},
    {id:'tool-github',group:'外部',name:'GitHub',plugin:'tool-github',gate:'需授权'}
  ],
  presets:[
    {id:'readonly',label:'只读',tools:['tool-read','tool-glob','tool-grep']},
    {id:'readnet',label:'只读+联网',tools:['tool-read','tool-glob','tool-grep','tool-web-search','tool-web-fetch']},
    {id:'readwrite',label:'可读写',tools:['tool-read','tool-edit','tool-write']},
    {id:'shell',label:'读写+Shell',tools:['tool-read','tool-edit','tool-write','tool-glob','tool-grep','tool-bash','tool-pwsh']},
    {id:'plugin',label:'插件创作',tools:['tool-read','tool-edit','tool-write','tool-glob','tool-grep','tool-bash','tool-skill','tool-todo-write']}
  ],
  templates:[
    {id:'co-explorer',name:'co-explorer',summary:'检索项目文件与代码，汇报路径、位置和证据。',preset:'readonly',brief:'你负责只读探索代码库。优先检索定位，再阅读相关文件；不修改任何文件。以路径和行号提供可核验的证据，遇到搜索结果不足时明确说明。',body:'先用路径搜索和内容搜索定位，再阅读相关文件并核对上下文。结论附文件路径与行号；区分直接证据和推断。不修改文件、不运行会改变状态的命令。',tools:['tool-read','tool-glob','tool-grep']},
    {id:'co-librarian',name:'co-librarian',summary:'查找官方文档和可信外部资料，并交叉核实来源。',preset:'readnet',brief:'你负责资料研究。先搜索候选来源，再读取被选中的页面；优先官方文档和一手资料。把来源链接放在相关结论旁，区分已证实事实与推断，不把搜索摘要当作完整证据。',body:'围绕问题拆分检索词，优先官方文档、论文或原始公告。阅读具体页面并核对发布日期、适用版本与出处；来源冲突时如实说明。所有结论在正文附近标注来源。',tools:['tool-read','tool-glob','tool-grep','tool-web-search','tool-web-fetch']},
    {id:'co-writer',name:'co-writer',summary:'依据提纲撰写、改写中文内容，保持事实与口吻一致。',preset:'readwrite',brief:'你负责中文写作。先确认目标读者、用途和口吻，再组织内容；表达具体、克制，不补造事实，必要时标出待核实内容。修改时保留原文意图，并简要交代重要改动。',body:'根据用户给出的目标、提纲和素材写作或改写。先整理信息层次，再完成初稿；检查逻辑、重复、语气和事实边界。没有来源支撑时不虚构细节，交付时说明尚待确认的内容。',tools:['tool-read','tool-edit','tool-write']},
    {id:'co-fixer',name:'co-fixer',summary:'修复代码问题，遵循仓库约定并运行针对性验证。',preset:'shell',brief:'你负责代码修改与验证。先读取现有实现和项目约定，保持改动范围聚焦；根据风险补充测试。完成后说明修改文件、验证结果和未覆盖的风险。执行命令前确认其目标与影响范围。',body:'先查看相关代码、测试和仓库约定，再定位根因并作最小必要修改。优先运行针对性测试，必要时再扩展验证。不要覆盖用户未提交的改动；最终汇报文件位置、命令结果和残余风险。',tools:['tool-read','tool-edit','tool-write','tool-glob','tool-grep','tool-bash','tool-pwsh']},
    {id:'co-designer',name:'co-designer',summary:'设计并实现清晰一致的界面，尊重项目设计系统与组件边界。',preset:'plugin',brief:'你负责前端 UI/UX 设计实现。先观察现有设计系统与交互，再实现完整、响应式的体验。确保排版清晰、状态明确、键盘可用，并验证用户实际看到的页面；避免加入未被要求的复杂结构。',body:'从真实使用场景出发检查布局密度、对比度、响应式、反馈状态和键盘可用性。优先沿用现有组件与样式；实现后检查关键视口和主要交互，不以代码存在代替视觉验证。',tools:['tool-read','tool-edit','tool-write','tool-glob','tool-grep','tool-bash','tool-skill','tool-todo-write']},
    {id:'co-planner',name:'co-planner',summary:'把目标、约束和现状整理成可执行步骤与验收条件。',preset:'readonly',brief:'你负责制定实施方案。先区分目标、约束、已知信息和待确认事项，再按依赖关系拆分步骤，为每步写清产出与验收方式。方案保持精简，不提前执行或扩大范围。',body:'检查任务目标及限制，识别依赖、风险与未知项。按先后顺序给出可验证的步骤，标记需要用户决策的事项。除非用户明确要求实施，否则只输出方案。',tools:['tool-read','tool-glob','tool-grep']},
    {id:'co-editor',name:'co-editor',summary:'审校中文稿件的事实表达、逻辑、标点和错别字。',preset:'readonly',brief:'你负责中文审校。按事实准确性、逻辑连贯、用词、标点和错别字检查文本。优先列出具体问题并引用原句；不确定的事实单列待核验，不擅自改写作者立场。',body:'逐段检查内容，问题按影响程度排列。每项指出原文位置、问题原因和可执行建议；把事实核验与文字润色分开。若没有明确问题，直接说明审校范围和残余不确定性。',tools:['tool-read','tool-glob','tool-grep']},
    {id:'co-oracle',name:'co-oracle',summary:'从架构与代码风险角度审查方案，指出关键假设和简化空间。',preset:'readonly',brief:'你负责架构审查与复杂问题分析。先核对现有边界和调用关系，再指出可复现的风险、隐含假设与验证办法。结论按严重程度排序，避免没有证据的泛化建议。',body:'从数据流、状态边界、错误处理、兼容性和测试覆盖检查实现。优先给出路径与行号证据；提出替代方案时说明成本和收益。不直接修改代码，除非用户另行授权。',tools:['tool-read','tool-glob','tool-grep']},
    {id:'co-outliner',name:'co-outliner',summary:'设计中文选题与写作提纲，列出所需素材和核验点。',preset:'readnet',brief:'你负责中文选题与提纲。先明确受众、目标和篇幅，再提出清晰的内容结构、论点顺序与素材清单。联网材料标明来源；区分已知事实、待补素材和写作建议。',body:'围绕主题列出角度与结构，避免标题与正文目标错位。每个章节说明作用、核心信息和可用素材；列出事实核验项与缺失资料。研究结论附可追溯来源。',tools:['tool-read','tool-glob','tool-grep','tool-web-search','tool-web-fetch']},
    {id:'co-observer',name:'co-observer',summary:'检查截图、图片或文档版面的可见内容并描述差异。',preset:'readonly',brief:'你负责视觉材料观察。只依据可见内容描述对象、文字、布局和明显差异；对无法辨认的区域明确标注不确定，不推测图片之外的事实。',body:'观察图像中的界面层级、可读文字、对齐、遮挡和状态差异。需要比较时逐项描述变化；OCR 或视觉判断不确定时标记置信边界，不把猜测写成事实。',tools:['tool-read','tool-glob','tool-grep']},
    {id:'co-cordis',name:'co-cordis',summary:'组合插件与 preset，检查配置边界并完成受控创作。',preset:'plugin',brief:'你负责插件与 preset 的组合修复或创作。先确认现有格式、工具边界和任务范围，再按项目约定修改；验证配置可解析且行为符合预期，并报告变更与验证结果。',body:'读取相邻配置和相关约定后再改动。保持标识、字段和权限边界一致；先做小范围验证，再执行完整校验。禁止加入与任务无关的插件或权限。',tools:['tool-read','tool-edit','tool-write','tool-glob','tool-grep','tool-bash','tool-skill','tool-todo-write']},
    {id:'co-council',name:'co-council',summary:'并行比较多个观点，汇总一致意见、分歧与证据。',preset:'readnet',brief:'你负责多方观点比较。把问题和决策标准写清楚，分别记录支持证据、反对意见与未知项；最后区分共识、分歧和建议，不把多数意见等同于事实。',body:'针对重要或不可逆决策，使用清晰问题和统一评估维度比较观点。检查来源质量与假设差异，优先呈现能改变结论的分歧，给出可验证的下一步。',tools:['tool-read','tool-glob','tool-grep','tool-web-search','tool-web-fetch']},
    {id:'co-rule-app',name:'co-rule-app',summary:'检查应用级规则文件的适用范围、冲突与落地方式。',preset:'readonly',brief:'你负责应用级规则文件分析。先定位规则文件及其作用范围，再核对规则之间是否冲突、是否可执行。引用原文位置说明结论，不臆测未读取的配置。',body:'检查规则的优先级、覆盖范围、重复项与执行条件。对每项建议说明影响的文件或流程；区分明确冲突和仅需澄清的表述。',tools:['tool-read','tool-glob','tool-grep']},
    {id:'co-rule-project',name:'co-rule-project',summary:'检查项目约定与仓库实际结构是否一致。',preset:'readonly',brief:'你负责项目规则分析。阅读项目级约定并对照仓库结构、脚本和测试，指出过时、冲突或缺失的内容。用具体路径和证据支撑判断。',body:'从仓库根目录和相关子目录查找项目说明，核对命令、目录、技术栈和代码模式。输出按影响排序的问题及准确位置，不替用户扩展规则范围。',tools:['tool-read','tool-glob','tool-grep']},
    {id:'co-rule-user',name:'co-rule-user',summary:'检查用户级规则的范围、表述和与任务的关系。',preset:'readonly',brief:'你负责用户级规则分析。先确认规则的适用范围，再检查内容是否清楚、是否相互矛盾以及是否与当前任务相关。结论引用实际读取的文本。',body:'关注规则覆盖范围、优先级和例外条件。指出需要澄清或可能误用的语句；不把用户偏好扩展成项目强制约定。',tools:['tool-read','tool-glob','tool-grep']},
    {id:'official-plugins',name:'official-plugins',summary:'核查官方插件能力、限制与可用配置方式。',preset:'readnet',brief:'你负责官方插件能力核查。先确认用户询问的具体能力，再查阅官方资料和实际配置边界；区分已有能力、需要授权的能力和不支持的部分，并为结论附上来源。',body:'围绕具体功能查找官方文档、发布说明或配置定义。说明适用版本、授权前提和限制；资料不足时明确指出，不把推测写成产品承诺。',tools:['tool-read','tool-glob','tool-grep','tool-web-search','tool-web-fetch']}
  ],
  orchestrator:{id:'co-orchestrator',name:'co-orchestrator',group:'builtin',summary:'纯调度，负责拆解目标、组织委派并汇总交付。',preset:null,tools:['tool-delegate','tool-delegate-batch','tool-workflow','tool-todo-write','tool-ask-user-question','tool-background-task','tool-target','tool-skill'],brief:'你负责理解用户目标、拆分任务、选择合适角色、检查交付并汇总结果。保持事实准确，遇到不确定信息时明确说明。',body:'你只负责调度与质量把关，不直接替专职角色执行具体工作。先判断任务边界和验收条件，再使用单角色或批量委派；需要时维护待办、跟踪目标、启动工作流或追问用户。审核返回结果是否满足原始目标，指出证据、遗漏与风险后汇总。',tier:'不绑定档位'},
  customRoles:[

function chooseTemplate(id,rerender=true){let source;if(id==='blank')source={id:'blank',name:'',description:'',summary:'',brief:'',body:'',tools:[]};else source=role(id)||MOCK.templates.find(t=>t.id===id);if(!source)return;state.editingRole=null;state.templateLabel=id==='blank'?'空白角色':source.name;state.roleDraft={id:'',name:id==='blank'?'':uniqueCopyName(source.name),description:source.description||source.summary||'',summary:source.summary||source.description||'',brief:source.brief||'',body:source.body||'',tools:[...(source.tools||[])],group:'custom',preset:source.preset||null,templateLabel:state.templateLabel,kind:id==='blank'?'':(LEAD_ROLE_IDS.includes(id)?'lead':'member')};state.pickerOpen=false;if(rerender)render()}
function closeRoleForm(){state.roleEditorOpen=false;state.kindError=false;state.pickerOpen=false;state.roleDraft=null;state.editingRole=null;state.templateLabel='';render()}
function openDetail(id){const r=role(id);if(!r)return;const dlg=$('#detailDialog');dlg.innerHTML=`<div class="dialog-head"><strong id="detailTitle">角色详情 · ${esc(r.name)}</strong><button class="btn quiet small" data-action="close-detail" aria-label="关闭详情">×</button></div><div class="dialog-content"><div><span class="badge ${tierClass(r)}">${esc(tierText(r))}</span><span class="role-meta"> · ${r.tools.length} 个工具</span></div><div class="detail-label">提示词（brief）</div><div class="prompt-block">${esc(r.brief||'暂无提示词')}</div><details><summary>完整正文</summary><div class="body-scroll">${esc(r.body||'暂无正文')}</div></details><div class="detail-label">绑定工具</div>${r.tools.length?`<ul class="detail-tools">${r.tools.map(id=>`<li>${esc(toolLabel(id))}</li>`).join('')}</ul>`:'<div class="role-meta">无绑定工具</div>'}</div>`;dlg.showModal()}
function openTeam(id){state.editingTeam=id;state.draftTeam=structuredClone(state.teams.find(t=>t.id===id));state.invalidLead=null;render()}
function saveRole(){const d=state.roleDraft;if(!d)return;if(!d.kind){state.kindError=true;render();showToast('请选择角色类型。');return}const name=d.name.trim();if(!name){showToast('请填写角色名');$('#roleName')?.focus();return}const conflict=state.roles.some(r=>r.id!==state.editingRole&&r.name.toLowerCase()===name.toLowerCase());if(conflict){showToast('角色名已存在，请调整名称');$('#roleName')?.focus();return}if(state.editingRole){const current=role(state.editingRole);Object.assign(current,structuredClone(d),{id:state.editingRole,name,description:d.description.trim(),summary:d.description.trim()||d.summary,group:current.group})}else{state.roles.push({...structuredClone(d),id:`custom-${Date.now()}`,name,description:d.description.trim(),summary:d.description.trim()||d.summary,group:'custom'})}closeRoleForm();showToast('角色已保存')}
function handleAction(action,id){if(action==='detail'){openDetail(id);return}if(action==='close-detail'){$('#detailDialog').close();return}if(action==='open-presets'){showToast('原型演示：请在 DSH 设置 → Agent 预设 中选择');return}if(action==='new-team'){if(state.editingTeam){showToast('请先完成当前团队编辑');return}const id=`team-${Date.now()}`;const draft={id,name:'',description:'',members:[],lead:'',isNew:true};state.teams.push(draft);state.editingTeam=id;state.draftTeam=structuredClone(draft);state.invalidLead=null;render();document.querySelector(`[data-team="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest'});return}if(action==='edit-team'){state.editingTeam===id?(state.editingTeam=null,state.draftTeam=null):openTeam(id);render();return}if(action==='delete-team'){if(state.teams.find(t=>t.id===id)?.presetId===state.currentSessionPresetId){showToast('当前会话预设对应的团队暂不可删除');return}if(state.teams.length<2){showToast('至少保留一个团队');return}state.teams=state.teams.filter(t=>t.id!==id);if(state.editingTeam===id){state.editingTeam=null;state.draftTeam=null}render();showToast('团队已删除');return}if(action==='cancel-team'){if(state.draftTeam?.isNew)state.teams=state.teams.filter(t=>t.id!==state.editingTeam);state.editingTeam=null;state.draftTeam=null;state.invalidLead=null;render();return}if(action==='demo-error'){const demoted=state.roles.find(r=>!isLeadKind(r));if(!demoted){showToast('没有队员类型角色可用于演示');return}state.draftTeam.lead=demoted.id;state.invalidLead=demoted.id;render();return}if(action==='save-team'){const d=state.draftTeam;if(!d.name.trim()){showToast('请填写团队名');document.querySelector('[data-team-field="name"]')?.focus();return}if(d.lead&&!isLeadKind(role(d.lead))){state.invalidLead=d.lead;render();showToast('该角色不是队长类型，保存将被拒绝');return}const t=state.teams.find(x=>x.id===state.editingTeam);const presetId=teamPresetId(d);Object.assign(t,structuredClone(d),{name:d.name.trim(),presetId,isNew:false});state.editingTeam=null;state.draftTeam=null;state.invalidLead=null;render();showToast(`团队已保存并注册为 Agent 预设：${presetId}`);return}if(action==='use-orchestrator'){openRoleCreate('co-orchestrator');return}if(action==='edit-role'){const r=role(id);if(!r)return;state.roleEditorOpen=true;state.pickerOpen=false;state.editingRole=id;state.templateLabel='';state.roleDraft=structuredClone(r);state.roleDraft.description=r.description||r.summary||'';render();$('#createMount').scrollIntoView({behavior:'smooth',block:'nearest'});return}if(action==='delete-role'){state.roles=state.roles.filter(r=>r.id!==id);state.teams.forEach(t=>{t.members=t.members.filter(x=>x!==id);if(t.lead===id)t.lead=''});if(state.draftTeam){state.draftTeam.members=state.draftTeam.members.filter(x=>x!==id);if(state.draftTeam.lead===id)state.draftTeam.lead=''}render();showToast('角色已删除');return}if(action==='reselect-template'){state.pickerOpen=true;render();return}if(action==='close-role-form'){closeRoleForm();return}if(action==='save-role'){saveRole()}}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){state.activeTab=tab.dataset.tab;render();return}const templ=e.target.closest('[data-template]');if(templ){state.roleEditorOpen=true;chooseTemplate(templ.dataset.template);$('#createMount').scrollIntoView({behavior:'smooth',block:'nearest'});return}const p=e.target.closest('[data-preset]');if(p&&state.roleDraft){const selected=preset(p.dataset.preset);state.roleDraft.tools=[...selected.tools];state.roleDraft.preset=selected.id;renderCreate();const note=$('.preset-note');if(note)note.textContent=`已按「${selected.label}」预选 ${selected.tools.length} 个工具`;return}const action=e.target.closest('[data-action]');if(action)handleAction(action.dataset.action,action.dataset.id)});
document.addEventListener('input',e=>{const search=e.target.closest('[data-role-search]');if(search){state.roleSearch=search.value;renderCatalog();return}const field=e.target.dataset.formField;if(field&&state.roleDraft){if(field==='name')state.roleDraft.name=e.target.value;else if(field==='description'){state.roleDraft.description=e.target.value;state.roleDraft.summary=e.target.value}else state.roleDraft[field]=e.target.value;return}const teamField=e.target.dataset.teamField;if(teamField&&state.draftTeam){state.draftTeam[teamField]=e.target.value;if(teamField==='name'){const card=e.target.closest('.team-card');card.querySelector('.team-title').textContent=teamTitle(state.draftTeam);const presetId=teamPresetId(state.draftTeam);const cardId=card.querySelector('.team-preset-id');if(cardId)cardId.textContent=`预设 id：${presetId}`;const preview=card.querySelector('.team-preset-preview');if(preview)preview.textContent=presetId;if(state.currentSessionPresetId===state.draftTeam.presetId){$('#currentName').textContent=teamTitle(state.draftTeam);$('#currentPresetId').textContent=state.currentSessionPresetId}}}});
document.addEventListener('change',e=>{if(e.target.matches('[data-member]')&&state.draftTeam){const id=e.target.dataset.member;state.draftTeam.members=e.target.checked?[...state.draftTeam.members,id]:state.draftTeam.members.filter(x=>x!==id);state.invalidLead=null;render();return}if(e.target.id==='leadSelect'&&state.draftTeam){state.draftTeam.lead=e.target.value;state.invalidLead=e.target.value&&!isLeadKind(role(e.target.value))?e.target.value:null;render();return}if(e.target.matches('[data-tool-check]')&&state.roleDraft){const id=e.target.dataset.toolCheck;state.roleDraft.tools=e.target.checked?[...state.roleDraft.tools,id]:state.roleDraft.tools.filter(x=>x!==id);state.roleDraft.preset=rolePreset(state.roleDraft)?.id||null;renderCreate();return}});
$('#addRole').addEventListener('click',()=>openRoleCreate(null));$('#detailDialog').addEventListener('click',e=>{if(e.target===$('#detailDialog'))$('#detailDialog').close()});
const MODEL_PROVIDERS=[{id:'DeepSeek',label:'DeepSeek',models:['deepseek-chat','deepseek-reasoner']},{id:'Anthropic',label:'Anthropic',models:['claude-sonnet-4','claude-opus-4']},{id:'OpenAI',label:'OpenAI',models:['gpt-5','gpt-5-mini']},{id:'Moonshot',label:'Moonshot',models:['kimi-k2']}];
const REASONING=[['minimal','默认'],['low','低'],['medium','中'],['high','高']];
function emptyModel(){return{provider:'',model:'',reasoning:'',maxOutput:''}}
function normalizeModel(m){return{provider:m?.provider||'',model:m?.model||'',reasoning:m?.reasoning||'',maxOutput:m?.maxOutput||''}}
function providerInfo(id){return MODEL_PROVIDERS.find(x=>x.id===id)}
function reasoningLabel(value){return value==='minimal'?'默认':value==='low'?'低':value==='medium'?'中':value==='high'?'高':'默认'}
function modelSummary(m){const x=normalizeModel(m);if(!x.provider)return`当前：继承会话默认（deepseek-chat · ${reasoningLabel(x.reasoning||'medium')}）`;const p=providerInfo(x.provider);return`当前：自定义（${p?.label||x.provider} · ${x.model||'未选择模型'} · ${reasoningLabel(x.reasoning)}）${x.maxOutput?` · 最大输出 ${esc(x.maxOutput)}`:''}`}
function modelBadge(r){const m=normalizeModel(r?.model);return m.provider&&m.model?`<span class="model-pill" title="${esc(m.provider)} · ${esc(m.model)}">${esc(m.model)}</span>`:'<span class="model-pill inherited">继承</span>'}
function modelRouting(target,context,roleId=''){const m=normalizeModel(target?.model);const providerOptions=MODEL_PROVIDERS.map(p=>`<option value="${esc(p.id)}" ${m.provider===p.id?'selected':''}>${esc(p.label)}</option>`).join('');const models=providerInfo(m.provider)?.models||[];const modelOptions=models.map(x=>`<option value="${esc(x)}" ${m.model===x?'selected':''}>${esc(x)}</option>`).join('');const reasoning=REASONING.map(([value,label])=>{const active=m.reasoning===value||(!m.reasoning&&value==='minimal');return`<button type="button" class="${active?'active':''}" data-reasoning="${value}" data-model-context="${context}" data-role-id="${esc(roleId)}" aria-pressed="${active}">${label}</button>`}).join('');return`<section class="model-routing"><div class="model-head"><div><strong>运行模型</strong><div class="model-summary">${modelSummary(m)}</div></div><button type="button" class="btn quiet small model-reset" data-action="reset-model" data-model-context="${context}" data-role-id="${esc(roleId)}">恢复默认</button></div><div class="model-grid"><div class="field"><label>供应商</label><select data-model-field="provider" data-model-context="${context}" data-role-id="${esc(roleId)}"><option value="" ${!m.provider?'selected':''}>默认（跟随会话）</option>${providerOptions}</select></div><div class="field"><label>模型</label><select data-model-field="model" data-model-context="${context}" data-role-id="${esc(roleId)}" ${m.provider?'':'disabled'}><option value="">${m.provider?'选择模型':'先选供应商'}</option>${modelOptions}</select></div><div class="field"><span class="model-field-label">推理强度</span><div class="reasoning-buttons">${reasoning}</div><small class="model-hint">影响思考预算与耗时，默认跟随会话设置</small></div><div class="field"><label>最大输出</label><input type="number" min="1" step="1" placeholder="例如 4000" value="${esc(m.maxOutput)}" data-model-field="maxOutput" data-model-context="${context}" data-role-id="${esc(roleId)}"></div></div></section>`}
state.roles.forEach(r=>{r.model=normalizeModel(r.model);if(!r.kind)r.kind=isLeadKind(r)?'lead':'member'});
Object.assign(role('co-fixer').model,{provider:'Anthropic',model:'claude-opus-4',reasoning:'high'});
Object.assign(role('co-writer').model,{provider:'OpenAI',model:'gpt-5',reasoning:'medium'});
const baseChooseTemplate=chooseTemplate;
chooseTemplate=function(id,rerender=true){baseChooseTemplate(id,false);if(state.roleDraft)state.roleDraft.model=emptyModel();if(rerender)render()};
const baseRenderRoleForm=renderRoleForm;
renderRoleForm=function(){const html=baseRenderRoleForm();return state.roleDraft?html.replace('</form>',`${modelRouting(state.roleDraft,'draft')}</form>`):html};
const baseRenderTeamEditor=renderTeamEditor;
renderTeamEditor=function(){let index=0;const rows=[...state.roles.filter(r=>r.group==='builtin'),...state.roles.filter(r=>r.group==='custom')];return baseRenderTeamEditor().replace(/<div class="role-row">[\s\S]*?<\/div>/g,row=>{const r=rows[index++];return r?row.replace(/(<span class="badge [^"]+">[^<]*<\/span>)(<span class="role-meta">)/,(_,tier,meta)=>tier+modelBadge(r)+meta):row})};
const baseRenderCatalog=renderCatalog;
renderCatalog=function(){baseRenderCatalog();[['builtin','.builtin-role-item'],['custom','.custom-role-item']].forEach(([group,selector])=>state.roles.filter(r=>r.group===group&&roleMatchesSearch(r)).forEach((r,i)=>{const card=document.querySelectorAll(selector)[i];const anchor=card?.querySelector('.catalog-meta .role-kind')||card?.querySelector('.catalog-meta .badge');if(anchor)anchor.insertAdjacentHTML('afterend',modelBadge(r))}))};


const baseHandleAction=handleAction;
handleAction=function(action,id){if(action==='reselect-template'){state.editingRole=null;state.roleDraft=null;state.pickerOpen=true;state.roleEditorOpen=true;state.templateLabel='';render();$('#createMount').scrollIntoView({behavior:'smooth',block:'nearest'});return}if(action==='edit-role'){const r=role(id);if(!r)return;state.roleEditorOpen=true;state.editingRole=id;state.pickerOpen=false;state.templateLabel=r.name;state.roleDraft=structuredClone(r);state.roleDraft.model=normalizeModel(r.model);render();$('#createMount').scrollIntoView({behavior:'smooth',block:'nearest'});return}return baseHandleAction(action,id)};
openDetail=function(id){const r=role(id);if(!r)return;const dlg=$('#detailDialog');const note=r.group==='builtin'?'<p class="model-note">内置角色的提示词与工具由插件维护，模型路由可以单独配置</p>':'';dlg.innerHTML=`<div class="dialog-head"><strong id="detailTitle">角色详情 · ${esc(r.name)}</strong><button class="btn quiet small" data-action="close-detail" aria-label="关闭详情">×</button></div><div class="dialog-content"><div><span class="badge ${tierClass(r)}">${esc(tierText(r))}</span>${modelBadge(r)}<span class="role-meta"> · ${r.tools.length} 个工具</span></div><div class="detail-label">提示词（brief）</div><div class="prompt-block">${esc(r.brief||'暂无提示词')}</div><details><summary>完整正文</summary><div class="body-scroll">${esc(r.body||'暂无正文')}</div></details><div class="detail-label">绑定工具</div>${r.tools.length?`<ul class="detail-tools">${r.tools.map(id=>`<li>${esc(toolLabel(id))}</li>`).join('')}</ul>`:'<div class="role-meta">无绑定工具</div>'}${note}${modelRouting(r,'role',r.id)}</div>`;if(!dlg.open)dlg.showModal()};
function modelTarget(el){return el.dataset.modelContext==='draft'?state.roleDraft:role(el.dataset.roleId)}
function refreshModel(context,id){if(context==='draft'){renderCreate();return}render();openDetail(id)}
document.addEventListener('input',e=>{const field=e.target.closest('[data-model-field="maxOutput"]');if(!field)return;const target=modelTarget(field);if(!target)return;target.model=normalizeModel(target.model);target.model.maxOutput=field.value;const summary=field.closest('.model-routing')?.querySelector('.model-summary');if(summary)summary.textContent=modelSummary(target.model)});
document.addEventListener('change',e=>{const field=e.target.closest('[data-model-field]');if(!field)return;const target=modelTarget(field);if(!target)return;target.model=normalizeModel(target.model);if(field.dataset.modelField==='provider'){target.model.provider=field.value;target.model.model=providerInfo(field.value)?.models[0]||''}else if(field.dataset.modelField==='model')target.model.model=field.value;else target.model.maxOutput=field.value;refreshModel(field.dataset.modelContext,field.dataset.roleId)});
document.addEventListener('click',e=>{const reset=e.target.closest('[data-action="reset-model"]');if(reset){const target=modelTarget(reset);if(!target)return;target.model=emptyModel();refreshModel(reset.dataset.modelContext,reset.dataset.roleId);return}const button=e.target.closest('[data-reasoning]');if(!button)return;const target=modelTarget(button);if(!target)return;target.model=normalizeModel(target.model);target.model.reasoning=button.dataset.reasoning;refreshModel(button.dataset.modelContext,button.dataset.roleId)});
document.addEventListener('click',e=>{const kindBtn=e.target.closest('[data-kind]');if(!kindBtn||!state.roleDraft)return;state.roleDraft.kind=kindBtn.dataset.kind;state.kindError=false;renderCreate()});
render();
</script>
</body>
</html>
