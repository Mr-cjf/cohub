# cohub-subagent-readonly —— cohub 编排体系的**只读子代理**专用 agent preset。
#
# 背景：此前 cohub 的 delegate 只传 toolFilter（per-child 收窄），子代理仍完整继承
# 父 preset co-orchestrator —— 于是每个子代理都背着一份「你是主调度者、绝不亲自
# 操作文件」的 persona（实测每子代理白烧 ≈2.4k tokens），且工具表里还带着
# delegate / delegate_batch / subagent / subagent_fork / workflow 等委派类工具。
#
# 修复：DSH 0.2.1 的 SubagentStartRequest.agentPreset 是一等字段，child 创建时走
# presets.mount(childCtx, id)（见 dsh-subagent lib/types/child-agent.js
# applyChildComposition），因此本 preset 以**原生硬隔离**方式决定子代理的人设与工具表，
# 不再继承父 preset。
#
# 只读隔离是**真隔离**：@deepseek-ai/dsh-tool-fs 的 Config 有 write / edit 布尔开关
# （0.2.1-rc.3 实测：const Config = z.object({ read, readImage, write, edit, readLimit, ... })），
# 关掉后 apply() 根本不注册 write / edit 工具行（`if (resolved.write || resolved.edit)`
# 整段跳过，连 FsSandboxController 都不构造）。Shell 工具（tool-pwsh / tool-bash）整行不挂。

# ── 身份（精简：子代理不需要调度纪律，技能指令已由任务书 brief 注入）──────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # 字段名必须是 prefix（required）/ suffix；旧版 text 字段会让整行挂载失败。
    prefix: |-
      你是 cohub 编排体系的专职子代理——只负责完成当前这一件具体任务。
      不要试图调度、委派或拆分给其他代理；你的技能指令已由任务书注入，不要调用 skill 工具加载 co-orchestrator。
      事实与证据优先：结论前置，证据用 path:line 形式。

# ── 技能 ────────────────────────────────────────────────────────────────
# 保留 tool-skill：子代理偶尔需要读自己的技能正文（成本 1 个工具）。
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 任务面板 ────────────────────────────────────────────────────────────
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── 文件（只读）/ 搜索 / 外网 ────────────────────────────────────────────
# write / edit 显式关掉 —— 这是本 preset 与 write 版 preset 的唯一实质差别。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    write: false
    edit: false

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

# 不挂（与 write 版一致）：delegation / delegation-subagents / tool-subagent* /
# tool-workflow / tool-goal / tool-ask-user / tool-jobs / tool-cordis / mcp-github。
# 不挂 shell：只读代理不需要执行命令（真正的只读保证）。

# ── 上下文压缩（参数照 co-orchestrator 现有值）─────────────────────────────
# 注意：不要在 preset 里再挂 spill-local / spill-policy —— host bundle 已挂且已生效，
# 双层裁剪会让落盘的原文不可恢复（详见 co-orchestrator/agent.cordis.yml 注释）。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.5

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
