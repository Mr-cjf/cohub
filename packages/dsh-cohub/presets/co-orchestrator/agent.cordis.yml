# co-orchestrator agent preset —— cohub 纯调度主代理身份。
#
# 参照 @deepseek-ai/dsh 官方 code preset 的结构：本组合挂载于单个代理的
# scope，persona 行遮蔽部署默认 persona。模型面向工具全部显式列出；
# 不挂文件/编辑/Shell 工具行——在未全局注册这些工具行（如 dsh-base 最小化
# 组合）的部署中，本 preset 的主代理自然看不到它们。
#
# 注意（rc.6 限制）：subagent 子代理会继承父代理的 preset 组合，
# 且 per-child toolFilter 只能收窄不能放宽。因此在 dsh-base 全局注册了
# 全部模型工具的部署里，本 preset 无法硬性移除工具——
# 「绝不亲自操作文件」由 co-orchestrator 技能的硬性规则在提示词层约束
# （与 OpenCode 原版行为一致）。
#
# v0.3.0 修正（修复派发）：原 preset 只挂 tool-workflow，缺 spawn/fork
# 委派工具行，主代理无法实际 spawn co-* 子代理。这里补齐 delegation-subagents
# group（subagent/subagent_fork/control/list-agents/ralph），persona「全部委派
# 给专职子代理」才能落地。同时新增 compaction group 防长会话爆 context。

# ── 身份 ────────────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # 字段名必须是 prefix（required）/ suffix。旧版的 text 字段在 DSH 0.1.5-rc.2
    # 会使整行挂载失败（invalid config: $.prefix missing required value），
    # 进而该 preset 不可用、新会话无法创建。
    prefix: |-
      你是 cohub 中文智能体编排体系的主调度者集群（Orchestrator）——思考时以集群方式协作，调用不同代理集群分工处理，而非以独立个体独自完成。
      你的唯一职责是分析需求 → 委派信息收集 → 委派 co-planner 制定方案 → 审核 → 委派执行 → 委派验证；绝不亲自调用任何文件/代码读写与执行工具，全部委派给专职子代理。
      会话开始时，用 skill 工具加载 co-orchestrator 技能并严格遵守其工作流。
      调度纪律：并行委派每批不超过 3 个（取值：DSH 设置 → cohub.schedule.maxParallelBatch，缺省 3，部署可调）；
      预计接近墙钟预算的大批量任务必须分批并用 job 跟踪轮询（取值：DSH 设置 → cohub.schedule.wallClockBudgetMs，缺省 600000ms = 10 分钟），
      无 job 跟踪则前台小批串行；禁止在单个执行单元里并行启动全部 delegate；
      全程 Native 模式：用 persona 软约束主代理不亲自操作文件；批内并行由同条消息的多 tool_use 块承载，批间串行遵守同一批大小上限。

# ── 委派与调度工具面 ────────────────────────────────────────────────────
# subagents 注册表与 spawn/fork 后端在宿主组合（host plane）；本 preset 提供委派工具。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── 技能（co-* 技能目录由 dsh-cohub 全局注册，本 preset 只需加载工具） ──
# 注意：catalogEnabled: false 关闭目录注入——Orchestrator 使用 delegate() 委派，
# 从不通过 skill() 加载 co-* 技能，无需每步注入 14 个技能目录浪费 token。
# skill() 工具本身仍然注册，子代理（通过 delegate spawn）可正常使用。
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  config:
    catalogEnabled: false

# ── 任务与后台任务面板 ──────────────────────────────────────────────────
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 用户选项（方案末尾 A/B/C 确认） ────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── 目标循环（长任务多轮推进） ──────────────────────────────────────────
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── 子代理委派（修复：让 co-orchestrator 真正能 spawn co-* 子代理）───────────
# 原 delegation group 仅挂 tool-workflow（编排多 agent 脚本），缺 spawn/fork 委派行。
# 这里追加 spawn / fork / control / list-agents / ralph，让 subagent() / subagent_fork()
# 等工具真正出现在主代理面前；persona「全部委派给专职子代理」才能落地。
- id: delegation-subagents
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    

# ── 文件 / Shell / 外网（子代理继承使用；主代理 persona 禁止自用）────
# rc.6 限制：subagent 子代理继承父 preset 工具表，per-child toolFilter
# 只能收窄不能放宽。因此必须挂载这些工具行让子代理继承使用。
# 主代理看得见但不能用——由 persona 规则 2 约束（绝不亲自操作文件）。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

# ── 上下文压缩（防长会话爆 context）─────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
