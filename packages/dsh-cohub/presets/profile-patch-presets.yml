# ⚠️ 已废弃（deprecated）——本文件不再被任何代码读取，仅作为迁移说明保留。
#
# 历史：0.13.6 之前，cohub 生成 profile patch 声明（`- insert: { id: preset-<id>, name:
# '@deepseek-ai/dsh-agent-preset', ... }`）追加到 profile 的 cordis.patch.yml，靠宿主启动时
# 加载声明来注册 agent preset。本文件是那段声明的模板/片段留存。
#
# 现在（0.13.6 起 → 0.13.12 彻底停用）：preset 的唯一正源是**运行时注册**
# `ctx.agentPresets.register()`（见 packages/dsh-cohub/src/index.ts 的 ②c / ②d）。
# 声明写入已从 installAgentPresets() 中移除，原因：
#   · profile patch 声明先于插件 apply 被宿主加载 → 旧的 preset id/内容胜出；
#   · 运行时注册随后覆盖不掉已由声明挂载的 preset，实例里一度残留 6 条旧名声明。
#
# 迁移：若某个 profile 的 cordis.patch.yml 里仍残留 `- insert:` 的
# `@deepseek-ai/dsh-agent-preset` 声明块，请直接删除这些块（保留
# `@deepseek-ai/dsh-agent-preset-registry` 那一行，它是 registry 配置而非 preset 声明）。
# 声明写入的实现（applyPresetPatchDeclarations / buildPresetPatchDeclarations）仍保留在
# packages/dsh-cohub/src/preset-install.ts 中，供外部脚本显式调用，插件启动路径不再触发。
