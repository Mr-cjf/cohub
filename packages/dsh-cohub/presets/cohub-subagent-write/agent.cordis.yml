# cohub-subagent-write —— cohub 编排体系的**实施类子代理**专用 agent preset。
#
# 与 cohub-subagent-readonly 同构，差别只有两处：
#   ① tool-fs 保留 write / edit（实施类代理必须能改文件）；
#   ② 额外挂 shell 工具行（Windows 挂 tool-pwsh，其他平台挂 tool-bash，与
#      co-orchestrator 完全相同的平台门控写法）。
#
# 共同点（本次修复的核心）：**不挂任何委派类工具行** —— delegation /
# delegation-subagents / tool-subagent / tool-subagent-fork / tool-workflow /
# tool-goal / tool-ask-user / tool-jobs / tool-cordis / mcp-github 一律不挂，
# 从工具表层面就断掉「子代理再往下套娃」的可能（此前只靠 depth-guard 在运行期拒绝，
# 工具 schema 仍然每轮都在烧 token）。
#
# 机制依据：DSH 0.2.1 SubagentStartRequest.agentPreset 是一等字段，child 创建时
# presets.mount(childCtx, id) 硬切换组合，不再继承父 preset 的 persona 与工具表。

# ── 身份（精简）─────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # 字段名必须是 prefix（required）/ suffix；旧版 text 字段会让整行挂载失败。
    prefix: |-
      你是 cohub 编排体系的专职子代理——只负责完成当前这一件具体任务。
      不要试图调度、委派或拆分给其他代理；你的技能指令已由任务书注入，不要调用 skill 工具加载 co-orchestrator。
      事实与证据优先：结论前置，证据用 path:line 形式。

# ── 技能 ────────────────────────────────────────────────────────────────
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 任务面板 ────────────────────────────────────────────────────────────
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── 文件（读写）/ 搜索 / 外网 ────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

# ── Shell（平台互斥，写法照 co-orchestrator）──────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# 不挂（见文件头）：delegation / delegation-subagents / tool-subagent* /
# tool-workflow / tool-goal / tool-ask-user / tool-jobs / tool-cordis / mcp-github。

# ── 上下文压缩（参数照 co-orchestrator 现有值）─────────────────────────────
# 注意：不要在 preset 里再挂 spill-local / spill-policy —— host bundle 已挂且已生效，
# 双层裁剪会让落盘的原文不可恢复（详见 co-orchestrator/agent.cordis.yml 注释）。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.5

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
